<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lottery Results Board</title>
<style>
  :root {
    --bg-deep:     #e8edf5;
    --bg-panel:    #ffffff;
    --border:      #c8d4e8;
    --mid:         #4a5f7a;
    --dark:        #1a2a40;
    --header-h:    62px;
    --main-pad:    10px;
    --card-head-h: 46px;
    --card-gap:    10px;
    --row-h: calc((100vh - var(--header-h) - var(--main-pad)*2 - var(--card-head-h)) / 15);
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }

  body {
    background-color: var(--bg-deep);
    background-image: url('/bg.webp');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
    color: var(--dark);
    font-family: 'Calibri', 'Trebuchet MS', sans-serif;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  header {
    flex-shrink: 0;
    height: var(--header-h);
    background: linear-gradient(180deg, #1a3560, #1e3d6e);
    border-bottom: 2px solid #2c5090;
    padding: 0 24px;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 4px 20px rgba(0,0,0,.2);
    z-index: 100;
  }
  .site-url {
    font-size: 28px; font-weight: 900; letter-spacing: 2px;
    color: #fff; text-transform: uppercase; line-height: 1;
    text-shadow: 0 0 18px rgba(91, 200, 255, 0.45);
    font-family: 'Calibri', 'Trebuchet MS', sans-serif;
  }
  .hdr-center { text-align: center; }
  .hdr-warn {
    font-size: 32px; font-weight: 900; letter-spacing: 2px;
    color: #ffcc80; text-transform: uppercase;
    animation: blink 2.2s step-end infinite;
  }
  .clock-wrap { text-align: right; }
  .hdr-date {
    font-size: 11px; letter-spacing: 2px;
    color: rgba(255,255,255,.55); text-transform: uppercase; margin-bottom: 2px;
  }
  .clock {
    font-size: 26px; font-weight: 900; color: #fff;
    letter-spacing: 2px; line-height: 1;
    font-feature-settings: 'tnum';
  }

  /* Grid */
  main {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: var(--card-gap); padding: var(--main-pad);
    overflow: hidden; align-items: start;
  }
  .col-wrap { display: flex; flex-direction: column; gap: var(--card-gap); }

  /* Card */
  .card {
    display: flex; flex-direction: column;
    background: var(--bg-panel); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,.08);
    animation: rise .45s ease both;
  }
  .card-head {
    flex-shrink: 0; height: 42px;
    padding: 0 14px; display: flex; align-items: center;
  }
  .card-logo {
    height: 26px; width: auto; border-radius: 4px; flex-shrink: 0;
    object-fit: contain; background: rgba(255,255,255,.9);
    padding: 2px; margin-right: 8px;
  }
  .card-title {
    font-size: 18px; font-weight: 800; letter-spacing: .5px;
    color: #fff; text-transform: uppercase;
  }

  /* Row */
  .row {
    height: var(--row-h); flex-shrink: 0;
    display: flex; align-items: center;
    padding: 0 14px; gap: 8px;
    border-bottom: 1px solid #e4eaf2;
    transition: background .15s;
  }
  .row:nth-child(even) { background: #f7f9fc; }
  .row:last-child { border-bottom: none; }
  .row:hover { background: #eef3fc; }

  .time {
    width: 90px; flex-shrink: 0;
    font-size: 16px; font-weight: 600;
    color: #5a6a7d; letter-spacing: .3px; line-height: 1;
  }

  /* Balls */
  .balls {
    flex: 1; display: flex; align-items: center;
    justify-content: flex-end; gap: 2px;
  }
  .ball-group { display: flex; align-items: center; gap: 1px; }
  .ball-sep {
    font-size: 24px; font-weight: 700;
    color: #98a8b8; line-height: 1;
    flex-shrink: 0; margin: 0 1px;
  }
  .ball, .ball-d {
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; flex-shrink: 0;
    font-feature-settings: 'tnum';
  }
  .ball   { min-width: 28px; font-size: 30px; letter-spacing: -0.5px; }
  .ball-d { min-width: 18px; font-size: 30px; letter-spacing: -0.5px; }

  /* Card-level status badges */
  .card-status {
    font-size: 9px; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase; padding: 3px 10px; border-radius: 12px;
    margin-left: auto; flex-shrink: 0;
  }
  .card-status-closed,
  .card-status-noresult { background: rgba(255,255,255,.2); color: rgba(255,255,255,.7); }
  .card-status-closed { color: #fff; }
  .card-status-pending { background: #ff8f00; color: #fff; animation: pulse-pending 1.5s ease-in-out infinite; }

  /* Row-level status */
  .row-status {
    font-size: 9px; font-weight: 700; letter-spacing: .5px;
    text-transform: uppercase; padding: 2px 8px; border-radius: 10px; flex-shrink: 0;
  }
  .row-status-pending { background: #fff3e0; color: #e65100; animation: pulse-pending 1.5s ease-in-out infinite; }
  .row-status-noresult { background: #f5f5f5; color: #9e9e9e; }
  .status-pending {
    background: linear-gradient(90deg, #ff8f00, #ffa726);
    color: #fff; font-size: 12px; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase; padding: 4px 14px; border-radius: 20px;
    animation: pulse-pending 1.5s ease-in-out infinite;
  }
  .status-noresult {
    background: #bdbdbd; color: #fff; font-size: 12px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase;
    padding: 4px 14px; border-radius: 20px;
  }
  .status-corrected {
    font-size: 10px; font-weight: 700; color: #e65100;
    margin-left: 6px; letter-spacing: .5px;
  }

  /* Keyframes */
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse-pending { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0s !important; transition-duration: 0s !important; }
  }

  /* ── Responsive ───────────────────────────────────── */

  /* Large tablet / small desktop — 3 columns */
  @media (max-width: 1200px) {
    main { grid-template-columns: repeat(3, 1fr); }
    .ball   { min-width: 24px; font-size: 26px; }
    .ball-d { min-width: 16px; font-size: 26px; }
    .hdr-warn { font-size: 24px; }
    .time { width: 80px; font-size: 14px; }
    .card-title { font-size: 18px; }
  }

  /* Tablet portrait — 2 columns, scrollable */
  @media (max-width: 900px) {
    html, body { overflow: auto; height: auto; }
    main {
      grid-template-columns: repeat(2, 1fr);
      height: auto; overflow: visible; align-items: start;
    }
    :root { --row-h: 48px; }
    .row { height: 48px; }
    .ball   { min-width: 22px; font-size: 24px; }
    .ball-d { min-width: 14px; font-size: 24px; }
    .hdr-warn { font-size: 20px; letter-spacing: 1px; }
    .card-head { height: 42px; padding: 0 12px; }
    .card-title { font-size: 16px; }
    .card-logo { height: 24px; }
    .time { width: 74px; font-size: 13px; }
    .card-status { font-size: 8px; padding: 2px 8px; }

  }

  /* Large phone / small tablet — 2 columns, compact */
  @media (max-width: 700px) {
    header { height: auto; min-height: 52px; padding: 8px 14px; flex-wrap: wrap; gap: 4px; }
    .site-url { font-size: 16px; letter-spacing: 1.5px; }
    .hdr-warn { font-size: 15px; letter-spacing: 1px; width: 100%; text-align: center; order: 3; }
    .clock { font-size: 18px; }
    .hdr-date { font-size: 9px; }
    main { gap: 8px; padding: 8px; }
    .card { border-radius: 8px; }
    .row { height: 44px; padding: 0 10px; gap: 6px; }
    .ball   { min-width: 20px; font-size: 22px; }
    .ball-d { min-width: 12px; font-size: 22px; }
    .ball-sep { font-size: 14px; }
    .balls { gap: 2px; }
    .time { width: 66px; font-size: 12px; }
    .card-head { height: 38px; padding: 0 10px; }
    .card-title { font-size: 14px; }
    .card-logo { height: 20px; margin-right: 6px; }

    .status-pending, .status-noresult { font-size: 10px; padding: 3px 10px; }
  }

  /* Phone — single column */
  @media (max-width: 540px) {
    main { grid-template-columns: 1fr; }
    .hdr-center { width: 100%; }
    .row { height: 42px; padding: 0 8px; gap: 4px; }
    .ball   { min-width: 18px; font-size: 20px; }
    .ball-d { min-width: 12px; font-size: 20px; }
    .time { width: 60px; font-size: 11px; }
    .card-head { height: 36px; }
    .card-title { font-size: 13px; letter-spacing: 0; }
    .card-status { font-size: 7px; padding: 2px 6px; }
    .row-status { font-size: 8px; padding: 1px 6px; }
    .status-corrected { font-size: 8px; }
  }

  /* Very small phone */
  @media (max-width: 380px) {
    .ball   { min-width: 16px; font-size: 17px; }
    .ball-d { min-width: 10px; font-size: 17px; }
    .ball-sep { font-size: 12px; }
    .time { width: 52px; font-size: 10px; }
    .hdr-warn { font-size: 12px; }
    .clock { font-size: 16px; }
    .card-title { font-size: 12px; }

  }
</style>
</head>
<body>

<header>
  <div class="site-url">ISLANDNUMBERS.COM</div>
  <div class="hdr-center">
    <div class="hdr-warn">&#9888; &nbsp; Check your ticket before you leave &nbsp; &#9888;</div>
  </div>
  <div class="clock-wrap">
    <div class="hdr-date" id="dateStr"></div>
    <div class="clock" id="clock">--:--:--</div>
  </div>
</header>

<main id="board"></main>


<script>
  const DAYS   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  function tick() {
    const n = new Date();
    document.getElementById('clock').textContent =
      `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}:${String(n.getSeconds()).padStart(2,'0')}`;
    document.getElementById('dateStr').textContent =
      `${DAYS[n.getDay()]}, ${MONTHS[n.getMonth()]} ${n.getDate()}, ${n.getFullYear()}`;
  }
  tick(); setInterval(tick, 1000);

  const LOGOS = {
    anguilla:     'https://saturn.azureedge.net/resources/images/lottery/anguila/logo_loteria_anguilla.webp',
    ocean:        'https://goldoceanlottery.net/assets/img/goldoceanlogo-e1700467252604%20(1).png',
    lotedom:      'https://saturn.azureedge.net/resources/images/lottery/lotedom/logo_lotedom.webp',
    laprimera:    'https://saturn.azureedge.net/resources/images/lottery/la-primera/logo_la_primera.svg',
    lasuerte:     'https://saturn.azureedge.net/resources/images/lottery/la-suerte/logo_la_suerte.svg',
    kinglottery:  'https://saturn.azureedge.net/resources/images/lottery/king-lottery/logo-king-lottery.webp',
    real:         'https://saturn.azureedge.net/resources/images/lottery/real/logo.svg',
    nacional:     'https://saturn.azureedge.net/resources/images/lottery/nacional/logo_nacional.svg',
    loteka:       'https://saturn.azureedge.net/resources/images/lottery/loteka/logo_loteka.svg',
    quinielapale: 'https://saturn.azureedge.net/resources/images/lottery/leidsa/logo_leidsa.svg',
    georgia:      'https://upload.wikimedia.org/wikipedia/en/3/34/Georgia_Lottery_logo.png',
    newjersey:    'https://static.cdnlogo.com/logos/n/17/new-jersey-lottery.svg',
    florida:      'https://saturn.azureedge.net/resources/images/lottery/florida-lottery/logo-florida-lottery.webp',
    connecticut:  'https://upload.wikimedia.org/wikipedia/en/f/fc/CTLOTTO.png',
    newyork:      'https://images.seeklogo.com/logo-png/23/1/new-york-lottery-logo-png_seeklogo-233192.png'
  };

  // Tableau-inspired accessible palette — dark enough for WCAG AA on pastel bg
  const DAY_COLORS = [
    '#c62828', // Sunday - Red
    '#0d47a1', // Monday - Navy Blue
    '#e65100', // Tuesday - Burnt Orange
    '#00695c', // Wednesday - Teal
    '#880e4f', // Thursday - Dark Magenta
    '#2e7d32', // Friday - Green
    '#4a148c'  // Saturday - Deep Purple
  ];

  function blendWhite(hex, amount) {
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    return '#' + [r,g,b].map(c => Math.min(255, Math.round(c + (255 - c) * amount)).toString(16).padStart(2,'0')).join('');
  }

  function getBallColor(draw) {
    if (draw.date) {
      const [y, m, d] = draw.date.split('-').map(Number);
      return DAY_COLORS[new Date(y, m - 1, d).getDay()];
    }
    return DAY_COLORS[new Date().getDay()];
  }

  function renderBallsPick3(numbers, color) {
    return numbers.map((n, i) => {
      const ball = `<span class="ball" style="color:${color}">${n}</span>`;
      const group = `<span class="ball-group">${ball}</span>`;
      return (i < numbers.length - 1) ? group + '<span class="ball-sep">-</span>' : group;
    }).join('');
  }

  function renderBallsDigit(numbers, color) {
    let html = '<span class="ball-group">';
    for (let i = 0; i < numbers.length; i++) {
      if (numbers[i] === '-') {
        html += '</span><span class="ball-sep">-</span><span class="ball-group">';
      } else {
        html += `<span class="ball-d" style="color:${color}">${numbers[i]}</span>`;
      }
    }
    return html + '</span>';
  }

  function renderBalls(lottery, draw) {
    const c = getBallColor(draw);
    return lottery.format === 'pick3'
      ? renderBallsPick3(draw.numbers, c)
      : renderBallsDigit(draw.numbers, c);
  }

  function getCardStatus(lottery) {
    const hasNumbers = lottery.draws.some(d => d.numbers && d.numbers.length > 0);
    const allClosed = lottery.draws.length > 0 && lottery.draws.every(d => d.status === 'closed');
    if (allClosed && !hasNumbers) return 'closed';
    if (lottery.draws.some(d => d.status === 'pending')) return 'pending';
    if (lottery.draws.every(d => d.status === 'no_result') && !hasNumbers) return 'no_result';
    return null;
  }

  function renderCardStatusBadge(status) {
    if (status === 'closed') return '<span class="card-status card-status-closed">No Draw Today</span>';
    if (status === 'pending') return '<span class="card-status card-status-pending">Pending</span>';
    if (status === 'no_result') return '<span class="card-status card-status-noresult">No Result</span>';
    return '';
  }

  function renderRowBalls(lottery, draw) {
    const hasNumbers = draw.numbers && draw.numbers.length > 0;

    if (draw.status === 'closed') return hasNumbers ? renderBalls(lottery, draw) : '';

    if (draw.status === 'pending') {
      const badge = '<span class="row-status row-status-pending">Pending</span>';
      return hasNumbers ? badge + renderBalls(lottery, draw) : '<span class="status-pending">Pending</span>';
    }

    if (draw.status === 'no_result') {
      if (hasNumbers) return renderBalls(lottery, draw);
      return '<span class="status-noresult">No Result</span>';
    }

    return hasNumbers ? renderBalls(lottery, draw) : '';
  }

  function renderCard(lottery) {
    const cardStatus = getCardStatus(lottery);
    const rows = lottery.draws.map(draw => {
      const corrected = draw.corrected ? '<span class="status-corrected">CORRECTED</span>' : '';
      return `<div class="row">
        <span class="time">${draw.time}${corrected}</span>
        <span class="balls">${renderRowBalls(lottery, draw)}</span>
      </div>`;
    }).join('');

    return `<div class="card">
      <div class="card-head" style="background:linear-gradient(90deg,${lottery.color},${blendWhite(lottery.color,.15)})">
        ${LOGOS[lottery.id] ? `<img class="card-logo" src="${LOGOS[lottery.id]}" alt="">` : ''}
        <span class="card-title">${lottery.name}</span>
        ${renderCardStatusBadge(cardStatus)}
      </div>
      ${rows}
    </div>`;
  }

  function renderBoard(data) {
    document.getElementById('board').innerHTML = data.columns.map(col =>
      `<div class="col-wrap">${col.lotteries.map(renderCard).join('')}</div>`
    ).join('');
  }

  let lastDataHash = '';
  async function loadResults() {
    try {
      const res = await fetch('/api/results');
      const text = await res.text();
      if (text === lastDataHash) return;
      lastDataHash = text;
      const data = JSON.parse(text);
      renderBoard(data);
    } catch (e) {
      console.error('Failed to load results:', e);
    }
  }
  loadResults();
  setInterval(loadResults, 30000);
</script>
</body>
</html>
